{% extends 'base_app.html' %}

{% block title %}{% trans 'Edit bartender availability' %}{% endblock %}

{% block content %}
    <div class="page-header">
        <h1>{% trans 'Edit bartender availability' %}</h1>
    </div>

    <div>
        <div class="row mb-3">
            <label class="col-form-label col-lg-2">{% trans 'Event' %}</label>
            <div class="controls col-lg-8">
                <p class="input-static"><a href="{% url 'event' event.pk %}">{{ event }}</a></p>
            </div>
        </div>

        <div class="row mb-3">
            <label class="col-form-label col-lg-2">{% trans 'Bartender' %}</label>
            <div class="controls col-lg-8">
                <p class="input-static">{{ user.get_full_name }}</p>
            </div>
        </div>
    </div>

    {% crispy form %}
{% endblock %}
