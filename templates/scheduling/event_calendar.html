{% extends 'base_app.html' %}

{% block title %}{% trans 'Planning' %}{% endblock %}

{% block extrajs %}
<script>
$(document).ready(function() {
    var feedUrl = '{% url 'fetch-calendar-schedule' %}';
    var calendarEl = document.getElementById('calendar');
    // FullCalendar's plain 'en' locale is US English (month/day order);
    // use en-gb so all dates render as day/month.
    var locale = '{{ LANGUAGE_CODE }}' === 'en' ? 'en-gb' : '{{ LANGUAGE_CODE }}';

    var calendar = new FullCalendar.Calendar(calendarEl, {
        events: function(fetchInfo, successCallback, failureCallback) {
            fetch(feedUrl + '?start=' + encodeURIComponent(fetchInfo.startStr) + '&end=' + encodeURIComponent(fetchInfo.endStr), {
                headers: {'X-Requested-With': 'XMLHttpRequest'},
            })
                .then(function(response) { return response.json(); })
                .then(successCallback)
                .catch(failureCallback);
        },
        firstDay: 1,
        weekNumbers: true,
        // Stretch the hour rows to fill the calendar's height (successor of the
        // old v1 `weekMode: 'liquid'`); without it the area between the last hour
        // and the bottom of the calendar is left blank.
        expandRows: true,
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },
        initialView: 'timeGridWeek',
        locale: locale,
        loading: function(bool) {
            if(bool) $('#loading').show();
            else     $('#loading').hide();
        },
        eventDidMount: function(info) {
            // The placeholder rendered while drag-selecting mounts as an event
            // too; it has no real data, and its popover would be left behind
            // when the placeholder is removed.
            if (info.isMirror) return;

            var html  = "<b>{% trans 'Location' %}:</b> " + info.event.extendedProps.location;
            html += "<br><b>{% trans 'Organization' %}:</b> " + info.event.extendedProps.organizers;
            html += "<br><b>{% trans 'Bartenders' %}:</b> " + info.event.extendedProps.tenders;

            $(info.el).popover({
                container: 'body',
                content: html,
                html: true,
                title: info.event.title,
                trigger: 'hover',
            });
        },
        eventWillUnmount: function(info) {
            // Remove the popover together with its event element, otherwise it
            // lingers on screen when the element disappears while hovered
            // (view switch, refetch).
            $(info.el).popover('dispose');
        },

        selectable: true,
        // Render a placeholder event with its time range while dragging a
        // selection in the week view (successor of v1's selectHelper).
        selectMirror: true,
        select: function(info) {
            // All-day (month view) selections have midnight boundaries with an
            // exclusive end; show only the dates and let the planner pick the
            // times in the event form.
            var format = info.allDay
                ? function(d) { return d.toLocaleDateString(locale); }
                : function(d) { return d.toLocaleString(locale, {
                    day: 'numeric', month: 'numeric', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', hour12: false,
                  }); };

            var message = '{% trans 'Create event?' %}\n\n';
            message += '{% trans 'From' %}: ' + format(info.start) + '\n';
            message += '{% trans 'Till' %}: ' + format(info.end);

            if(window.confirm(message)) {
                var query = {
                    starts_at: info.start.toISOString(),
                    ends_at: info.end.toISOString(),
                };
                window.location.href = '{% url 'new-event' %}?' + $.param(query);
            } else {
                calendar.unselect();
            }
        },

        // week agenda view
        slotMinTime: '10:00:00',
        allDaySlot: false,

        // formatting
        // Note: v7 renamed the older `slotLabelFormat` option to `slotHeaderFormat`
        // (verified against the FullCalendar v7 bundle; using the old name is silently
        // ignored with a console warning rather than raising an error).
        slotHeaderFormat: {hour: '2-digit', minute: '2-digit', hour12: false},
        eventTimeFormat: {hour: '2-digit', minute: '2-digit', hour12: false},
        views: {
            // Only the week view puts dates in the column headers; the month
            // view keeps plain weekday names.
            timeGridWeek: {
                dayHeaderFormat: {weekday: 'short', day: 'numeric', month: 'numeric'},
                titleFormat: {day: 'numeric', month: 'short', year: 'numeric'},
            },
        },
    });

    calendar.render();
});
</script>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>
        {% trans 'Calendar' %}
        <small id="loading" style="display: none;">{% trans 'Loading...' %}</small>
        {% if is_planner %}
        <div class="float-end">
            <a href="{% url 'new-event' %}" class="btn btn-primary float-end">
                <span class="bi bi-plus-lg"></span>
                {% trans 'Add event' %}
            </a>
        </div>
        {% endif %}
    </h1>
</div>
<div id="calendar"></div>
{% endblock %}
