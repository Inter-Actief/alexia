{% load i18n %}
<nav aria-label="{% trans 'Page navigation' %}">
    <ul class="pagination justify-content-center">
        <li class="page-item{% if not page_obj.has_previous %} disabled{% endif %}">
            {% if page_obj.has_previous %}
            <a class="page-link" href="?page={{ page_obj.previous_page_number }}" aria-label="{% trans 'Previous' %}">&lsaquo;</a>
            {% else %}
            <span class="page-link" aria-hidden="true">&lsaquo;</span>
            {% endif %}
        </li>
        {% for page in page_obj.paginator.page_range %}
        <li class="page-item{% if page == page_obj.number %} active{% endif %}"{% if page == page_obj.number %} aria-current="page"{% endif %}>
            {% if page == page_obj.number %}
            <span class="page-link">{{ page }}</span>
            {% else %}
            <a class="page-link" href="?page={{ page }}">{{ page }}</a>
            {% endif %}
        </li>
        {% endfor %}
        <li class="page-item{% if not page_obj.has_next %} disabled{% endif %}">
            {% if page_obj.has_next %}
            <a class="page-link" href="?page={{ page_obj.next_page_number }}" aria-label="{% trans 'Next' %}">&rsaquo;</a>
            {% else %}
            <span class="page-link" aria-hidden="true">&rsaquo;</span>
            {% endif %}
        </li>
    </ul>
</nav>
